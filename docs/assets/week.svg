<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The weekly route: Monday Kharadi, Tuesday Viman Nagar, Wednesday Kalyani Nagar, Thursday Kharadi, Friday Viman Nagar, Saturday Kalyani Nagar, Sunday off. Lunch 12 to 3 PM.</title>
